
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join KodiCode!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="container">

    <header class="header">
      <!-- Replace with your actual hosted logo URL -->
      <img src="https://i.imgur.com/UdXYOqz.png" alt="KodiCode logo" class="logo">

      <span class="tag">KODICODE SUSCRIPTION</span>
    </header>

    <section class="content">
      <h1>Piensa como <span>Dev.</span></h1>

      <p>
        Actualizaciones, parches, rankings, nuevas funciones. No te lo pierdas!
      </p>

      <form id="subscribe-form">

        <label for="email">Tu correo aqui!</label>

        <input
          type="email"
          id="email"
          name="subscriber_email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <button type="submit" id="subscribe-button">
          A DARLE!
        </button>

        <p id="form-message" role="status" aria-live="polite"></p>

      </form>

      <p class="privacy">
        Nada de spam, pura cosa buena.
      </p>
    </section>

    <footer>
      <p>© 2026 KodiCode. Todos los derechos reservados.</p>
      <span>// HAPPY CODING!</span>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="./main.js"></script>

</body>
</html>
